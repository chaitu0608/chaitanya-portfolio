    <script>
      (function () {
        try {
          if (sessionStorage.getItem("portfolio-boot-seen") === "1") {
            document.documentElement.classList.remove("boot-loading");
            document.addEventListener("DOMContentLoaded", function () {
              document.body.classList.remove("boot-loading");
              var shell = document.getElementById("boot-shell");
              if (shell) shell.remove();
            });
          }
        } catch (e) {}
      })();
      (function () {
        var path = window.location.pathname;
        if (path === "/resume" || path === "/meet" || path === "/meet/") {
          document.documentElement.classList.remove("boot-loading");
          document.addEventListener("DOMContentLoaded", function () {
            document.body.classList.remove("boot-loading");
            var shell = document.getElementById("boot-shell");
            if (shell) shell.remove();
          });
        }
      })();
      (function(){try{var k='portfolio-theme';var s=localStorage.getItem(k);var d;if(s==='light')d=false;else if(s==='dark')d=true;else if(s==='system')d=matchMedia('(prefers-color-scheme: dark)').matches;else d=true;document.documentElement.classList.toggle('dark',d);document.documentElement.style.colorScheme=d?'dark':'light';}catch(e){document.documentElement.classList.add('dark');}})();
      document.documentElement.classList.add("boot-loading");
      document.addEventListener("DOMContentLoaded", function () {
        document.body.classList.add("boot-loading");
      });
    </script>
