<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-label="Chaitanya Dhamdhere — cdhamdhere.xyz">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="315" x2="1200" y2="315" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4ade80" stop-opacity="0.08"/>
      <stop offset="0.5" stop-color="#4ade80" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="avatarClip">
      <circle cx="280" cy="315" r="168"/>
    </clipPath>
    <linearGradient id="ring" x1="112" y1="147" x2="448" y2="483" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4ade80" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3f3f46" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- subtle grid -->
  <g stroke="#27272a" stroke-width="1" opacity="0.28">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
  </g>

  <!-- circular profile photo (left) -->
  <circle cx="280" cy="315" r="172" fill="#18181b"/>
  <image
    href="avatar.png"
    x="112"
    y="147"
    width="336"
    height="336"
    clip-path="url(#avatarClip)"
    preserveAspectRatio="xMidYMid slice"
  />
  <circle cx="280" cy="315" r="168" fill="none" stroke="url(#ring)" stroke-width="3"/>

  <!-- site copy (right) -->
  <text x="520" y="248" fill="#71717a" font-family="monospace" font-size="20">$ whoami</text>

  <text x="520" y="318" fill="#fafafa" font-family="monospace" font-size="52" font-weight="700">Chaitanya</text>
  <text x="520" y="382" fill="#4ade80" font-family="monospace" font-size="52" font-weight="700">Dhamdhere</text>

  <line x1="520" y1="408" x2="900" y2="408" stroke="#4ade80" stroke-opacity="0.35" stroke-width="1"/>

  <text x="520" y="452" fill="#a1a1aa" font-family="monospace" font-size="22">Engineer · Builder · Student</text>
  <text x="520" y="492" fill="#71717a" font-family="monospace" font-size="20">// aka chaitu</text>

  <text x="520" y="548" fill="#4ade80" font-family="monospace" font-size="24" font-weight="600">cdhamdhere.xyz</text>
</svg>
